; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-sta

; ======================================================================
; 1. ESP32 (EdgeRouter - STA + NAT + SPI Yönlendirici) -> /dev/ttyUSB0
; ======================================================================
[env:esp-sta]
platform = espressif32
board = esp-wrover-kit
framework = espidf
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags = 
    -DCONFIG_NODE_ROUTER=1

; Geriye dönük uyumluluk ve PlatformIO alt bar butonları için takma ad (alias)
[env:esp-wrover-kit]
extends = env:esp-sta

; ======================================================================
; 2. ESP32 (AP Node - SoftAP + SPI Köprüsü)            -> /dev/ttyUSB1
; ======================================================================
[env:esp32-ap]
platform = espressif32
board = esp32dev
board_upload.flash_size = 4MB
framework = espidf
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
build_flags = 
    -DCONFIG_NODE_AP=1
